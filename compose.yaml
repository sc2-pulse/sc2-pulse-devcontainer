x-podman:
  in_pod: false
services:
  app:
    image: localhost/sc2pulse-dev-app:latest
    build: .
    user: developer
    depends_on:
      podman:
        condition: service_healthy
    userns_mode: "keep-id:uid=1000,gid=1000"
    networks:
      - sc2pulse
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - app-src:/workspaces/sc2-pulse
      - app-maven-cache:/home/developer/.m2
      - app-vscode-cache:/home/developer/.vscode-server
      - app-vscode-root-cache:/root/.vscode-server
      - podman-socket:/run/podman
    environment:
      MAVEN_CONFIG: "/home/developer/.m2"
      DOCKER_HOST: "unix:///home/developer/.local/share/podman/podman.sock"
      TESTCONTAINERS_HOST_OVERRIDE: "podman"
      ORG_TESTCONTAINERS_HOST: "app"
      ORG_TESTCONTAINERS_NETWORK_EXTERNAL_NAME: "testcontainers"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_REUSE_ENABLE: "true"
      ORG_TESTCONTAINERS_TEST_REUSE_ENABLE: "true"
      ORG_TESTCONTAINERS_DEV_HTTP_SERVER_PORT: "${PORT:-8080}"
    command: >
      bash -c '
        trap "echo \"Shutdown signal received. Exiting.\"; exit 0" TERM INT;
        sleep infinity &
        wait
      '
    healthcheck:
      test: ["CMD-SHELL", "if [ $${SSH_SERVER_ENABLED} = \"true\" ]; then ssh -t -o StrictHostKeyChecking=accept-new 127.0.0.1 id; else exit 0; fi"]
      interval: 15s
      timeout: 1s
      retries: 1
      start_period: 10s
      start_interval: 2s
  podman:
    image: quay.io/podman/stable:v5.8.2
    user: podman
    privileged: true
    pids_limit: -1
    security_opt:
      - seccomp=unconfined
    networks:
      - sc2pulse
    volumes:
      - ./container/podman/registries.conf:/etc/containers/registries.conf:ro
      - podman-storage:/home/podman/.local/share/containers
      - podman-storage-rootful-dummy:/var/lib/containers
      - podman-socket:/home/podman/.local/share/podman-socket
    command: >
      bash -c '
        clean_podman_resources() {
            echo \"Cleaning podman resources...\";
            podman stop -t 10 --all && podman container prune --force;
            podman network rm testcontainers 2>/dev/null;
        }
        clean_podman_resources;
        podman network create testcontainers && podman system service --time=0 unix:///home/podman/.local/share/podman-socket/podman.sock &
        SOCKET_PID=$!
        trap "
          echo \"Shutdown signal received...\";
          clean_podman_resources;
          echo \"Stopping podman socket (PID \$$SOCKET_PID)...\";
          kill -TERM \$$SOCKET_PID;
          wait \$$SOCKET_PID 2>/dev/null;
          echo \"Cleanup complete. Exiting.\";
          exit 0
        " TERM INT;
        wait
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -S /home/podman/.local/share/podman-socket/podman.sock ]"]
      interval: 30s
      timeout: 2s
      retries: 1
      start_period: 5s
volumes:
  app-src:
  app-maven-cache:
  app-vscode-cache:
  app-vscode-root-cache:
  podman-storage:
  podman-storage-rootful-dummy:
  podman-socket:
networks:
  sc2pulse:
