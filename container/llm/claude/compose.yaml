services:
  sc2pulse-dev-llm:
    image: localhost/sc2pulse-dev-claude:latest
    build:
      context: ./container/llm
      args:
        - INSTALL_SCRIPT_URL=https://claude.ai/install.sh
    volumes:
      - sc2pulse-dev-claude-cache:/home/llm/.claude
      - ./container/llm/AGENTS.md:/workspaces/sc2-pulse/CLAUDE.md:ro
volumes:
  sc2pulse-dev-claude-cache:
