services:
  sc2pulse-dev-llm:
    image: localhost/sc2pulse-dev-codex:latest
    build:
      context: ./container/llm
      args:
        - INSTALL_SCRIPT_URL=https://chatgpt.com/codex/install.sh
    volumes:
      - sc2pulse-dev-codex-cache:/home/llm/.codex
      - ./container/llm/AGENTS.md:/workspaces/sc2-pulse/AGENTS.md:ro
      - ./container/llm/config.codex.toml:/etc/codex/config.toml:ro
volumes:
  sc2pulse-dev-codex-cache:
