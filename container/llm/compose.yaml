services:
  app:
    environment:
      SSH_SERVER_ENABLED: "true"
  llm:
    container_name: llm
    user: llm
    userns_mode: "keep-id:uid=1000,gid=1000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sc2pulse
    volumes:
      - app-src:/workspaces/sc2-pulse
    environment:
      SSH_CLIENT_WORKDIR: "/workspaces/sc2-pulse"
      SSH_CLIENT_DEST: "developer@app"
    command: >
      bash -c '
        trap "echo \"Shutdown signal received. Exiting.\"; exit 0" TERM INT;
        ssh-keygen -f '/home/llm/.ssh/known_hosts' -R 'app' > /dev/null;
        sleep infinity &
        wait
      '
    healthcheck:
      test: ["CMD-SHELL", "devcontainer-exec id"]
      interval: 15s
      timeout: 1s
      retries: 1
